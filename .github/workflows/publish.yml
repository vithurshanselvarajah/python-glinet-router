name: Publish

# Reusable workflow for one-off publishes (e.g. from `workflow_dispatch`
# after a manual release, or for back-porting fixes). The main release
# flow lives in release.yml and pushes to PyPI automatically when a
# commit message starting with "release:" lands on main.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        default: pypi
        options:
          - pypi
          - testpypi

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'testpypi' && 'https://test.pypi.org/p/glinet' || 'https://pypi.org/p/glinet' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Validate version
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text())
          version = data["project"]["version"]
          if not re.match(r"^\d+\.\d+\.\d+([ab]\d+|rc\d+|dev\d+)?$", version):
              raise SystemExit(f"Version {version!r} is not PEP 440 compliant")
          print(f"Publishing {data['project']['name']} {version}")
          PY

      - name: Build distributions
        run: |
          set -euo pipefail
          rm -rf dist/
          python -m build --sdist --wheel

      - name: Publish to PyPI
        if: inputs.environment == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish to TestPyPI
        if: inputs.environment == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # SKIP_EXISTING keeps earlier versions installable from TestPyPI
          # and avoids re-uploading the same wheel/sdist on retry.
          skip-existing: true
