name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.mode.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Check release trigger
        id: mode
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          should_release=false
          lc_message="${COMMIT_MESSAGE,,}"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            should_release=true
          elif [[ "$lc_message" == release:* && "$REF_NAME" == "main" ]]; then
            should_release=true
          fi

          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.mode.outputs.should_release == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from pyproject.toml
        if: steps.mode.outputs.should_release == 'true'
        id: version
        run: |
          set -euo pipefail

          version="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text())
          print(data["project"]["version"])
          PY
          )"

          if [[ -z "$version" ]]; then
            echo "Failed to read version from pyproject.toml" >&2
            exit 1
          fi

          tag="v${version}"

          # Detect pre-releases (a / b / rc suffixes) so GitHub Release
          # marks them correctly.
          is_prerelease="false"
          if [[ "$version" =~ (a|b|rc|dev|alpha|beta) ]]; then
            is_prerelease="true"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

      - name: Verify tag does not already exist
        if: steps.mode.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Bump the version in pyproject.toml." >&2
            exit 1
          fi

  build:
    name: Build sdist + wheel
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Verify pyproject parses and version is sensible
        run: |
          set -euo pipefail
          python - <<PY
          import tomllib, re
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text())
          version = data["project"]["version"]
          name = data["project"]["name"]
          assert re.match(r"^\d+\.\d+\.\d+([ab]\d+|rc\d+|dev\d+)?$", version), \
              f"Version {version!r} is not PEP 440 compliant"
          print(f"Building {name} {version}")
          PY

      - name: Build distributions
        run: |
          set -euo pipefail
          python -m build --sdist --wheel

      - name: Inspect built distributions
        run: |
          set -euo pipefail
          ls -lh dist/

      - name: Upload distributions (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ needs.prepare.outputs.version }}
          path: dist/*
          if-no-files-found: error

  test:
    name: Test on ${{ matrix.python-version }}
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      python-versions: '["3.12", "3.13"]'
    permissions:
      contents: read

  publish-testpypi:
    name: Publish to TestPyPI
    needs:
      - prepare
      - build
      - test
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/glinet
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.prepare.outputs.version }}
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs:
      - prepare
      - build
      - test
      - publish-testpypi
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/glinet
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.prepare.outputs.version }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs:
      - prepare
      - build
      - test
      - publish-pypi
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.prepare.outputs.version }}
          path: dist/

      - name: Collect commits since previous tag
        id: commits
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          previous_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            range="${previous_tag}..HEAD"
          else
            range="HEAD"
          fi
          {
            echo "commits<<EOF"
            git log "$range" --pretty=format:"- %s (%h)" --no-merges
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMITS: ${{ steps.commits.outputs.commits }}
        run: |
          set -euo pipefail
          {
            echo "## What's Changed"
            echo
            if [[ -n "$COMMITS" && "$COMMITS" != "EOF" ]]; then
              echo "$COMMITS"
            else
              echo "- Initial release of ${TAG}."
            fi
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "pip install glinet==${VERSION}"
            echo '```'
            echo
            echo "Full diff: https://github.com/${GITHUB_REPOSITORY}/compare/${TAG}...HEAD"
          } > release-notes.md

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          set -euo pipefail

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            gh_release_args=(--prerelease)
          else
            gh_release_args=()
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release ${TAG}"

          gh release create "$TAG" \
            dist/*.whl \
            dist/*.tar.gz \
            --title "glinet ${TAG}" \
            --notes-file release-notes.md \
            "${gh_release_args[@]}"

          git push origin "$TAG"
